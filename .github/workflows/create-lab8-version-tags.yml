name: Create Lab 8 version tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/create-lab8-version-tags.yml']
permissions:
  contents: write
concurrency:
  group: create-lab8-version-tags
  cancel-in-progress: false
jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create fixed version tags without overwriting existing refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = os.environ["REPOSITORY"]
          expected = {
              "v7": "ad468ea0751c9b2fb7b86b1a02bdd2104ff9a412",
              "v8": "4e73f5b6e21863ecc0e7f6cf23b59c48a1b874b7",
          }
          def api(method, path, payload=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if method == "GET" and error.code == 404:
                      return None
                  raise
          for tag, sha in expected.items():
              ref = api("GET", "/git/ref/tags/" + tag)
              if ref is not None:
                  if ref["object"]["sha"] != sha:
                      raise RuntimeError("Existing tag has a different target: " + tag)
                  print(tag + " already points to " + sha)
                  continue
              result = api("POST", "/git/refs", {"ref": "refs/tags/" + tag, "sha": sha})
              assert result["object"]["sha"] == sha
              print("Created " + tag + " -> " + sha)
